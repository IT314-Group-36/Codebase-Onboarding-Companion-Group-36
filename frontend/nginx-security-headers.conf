# Browser security headers. Included in the server block AND in every location that sets its own add_header, because
# nginx does not inherit add_header from the server level into a location that defines any add_header of its own.
#
# The Content-Security-Policy is sent in REPORT-ONLY mode first: the browser logs violations in the console but blocks
# nothing, so every page (graph, 3D components, login, Q&A) can be tested. When the console is clean, enforce it by
# renaming the header to Content-Security-Policy (here and in vercel.json).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://avatars.githubusercontent.com; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Strict-Transport-Security is not sent here: this nginx serves plain http (localhost). It is sent by Vercel (vercel.json).
