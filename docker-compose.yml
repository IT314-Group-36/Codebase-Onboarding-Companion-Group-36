services:
  db:
    image: postgres:16
    container_name: onboarding-db
    environment:
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: onboard
      POSTGRES_DB: onboarding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboard -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
