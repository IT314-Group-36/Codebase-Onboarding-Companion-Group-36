x-app: &app
  build: ./backend
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://onboard:onboard@db:5432/onboard
    REDIS_URL: redis://redis:6379
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}

services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: onboard, POSTGRES_PASSWORD: onboard, POSTGRES_DB: onboard}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboard"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
  api:
    <<: *app
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
  worker:
    <<: *app
    command: arq app.worker.WorkerSettings
    volumes: [models:/models]          # caches the embedding model between restarts
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}

volumes:
  pgdata:
  models:
