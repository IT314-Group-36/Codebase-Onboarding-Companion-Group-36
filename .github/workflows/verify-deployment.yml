name: Verify backend deployment

# Deliberately NOT triggered by push/workflow_run: Render's native CI gate must
# finish before deployment, so verification cannot be one of the checks it awaits.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA shown in the successful Render deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Deployed backend readiness
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify database readiness and exact deployed revision
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: python backend/scripts/verify_deployment.py --url "$BACKEND_URL" --revision "$EXPECTED_REVISION"
