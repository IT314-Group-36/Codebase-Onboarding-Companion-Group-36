name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://onboard:onboard@localhost:5432/onboard_test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: onboard
          POSTGRES_PASSWORD: onboard
          POSTGRES_DB: onboard_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U onboard -d onboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - name: Verify test database connection
        run: |
          uv run --locked python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          with create_engine(os.environ["DATABASE_URL"]).connect() as conn:
              conn.execute(text("SELECT 1"))
          PY
      - run: uv run --locked pytest -ra

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build