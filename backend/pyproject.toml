[project]
name = "onboarding-companion"
version = "0.2.0"
description = "Codebase Onboarding Companion - backend and AI pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "arq>=0.26",
    "networkx>=3.3",
    "tree-sitter>=0.23,<0.26",   # 0.26.0 segfaults in the Python binding on larger files
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=3.0",
    "fastembed>=0.4",
    "numpy",
    "cryptography>=43",          # Fernet: encrypts stored GitHub tokens
    "itsdangerous>=2.2",         # signed, expiring session cookies
    "httpx>=0.27",               # talks to the GitHub API (OAuth, repo and branch lists)
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio>=0.24", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ai_pipeline*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Explicit so the result does not change with the ruff version (newer defaults also flag FastAPI's Depends() as B008).
select = ["E4", "E7", "E9", "F", "I001"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are injected by naming them as arguments, which looks like a redefinition to F811
"tests/*" = ["F811", "E402"]
# deliberately compact one-line `if x: return y` dispatch tables
"ai_pipeline/stack_detector.py" = ["E701"]
